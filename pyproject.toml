[project]
name = "sqlanalyst"
version = "0.1.0"
description = "Natural language to SQL over a real Postgres, with validation before execution and a read-only sandbox."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "sqlglot>=26.0",          # parse and validate SQL properly, not with regex
    "anthropic>=0.40",
    "rich>=13.9",
    "typer>=0.15",
    "tenacity>=9.0",
]

[project.scripts]
sqlanalyst = "sqlanalyst.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
ui  = ["streamlit>=1.40", "pandas>=2.2", "altair>=5.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlanalyst"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# so `pytest` works in a fresh clone, with nothing installed
pythonpath = ["src"]
testpaths = ["tests"]
