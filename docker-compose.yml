name: sqlanalyst

services:
  postgres:
    image: postgres:17-alpine
    # Comes back after a reboot or a Docker Desktop restart. Without this the eval
    # fails with a connection timeout on 5434 and the reason looks like a bug in the
    # agent rather than a container that is simply not running.
    restart: unless-stopped
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: retail
    ports:
      - "5434:5432"          # 5434: rag-forge already uses 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/02-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d retail"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
